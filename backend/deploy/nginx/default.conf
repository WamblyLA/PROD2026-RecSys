server {
    listen 80;
    server_name team-22-staging-2-f9ab17.pages.prodcontest.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name team-22-staging-2-f9ab17.pages.prodcontest.ru;
    client_max_body_size 20m;

    # Resolve upstream at request time so nginx starts even when ML is not up
    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/team-22-staging-2-f9ab17.pages.prodcontest.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-22-staging-2-f9ab17.pages.prodcontest.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /ml {
        return 301 /ml/;
    }

    location /ml/ {
        set $ml_backend "ml-internal:8080";
        rewrite ^/ml/?(.*)$ /$1 break;
        proxy_pass http://$ml_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ml;
        proxy_redirect ~^(/.*)$ /ml$1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location /chat/stream {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}