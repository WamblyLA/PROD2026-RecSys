[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "adaptix==3.0.0b11",
    "cryptography>=46.0.0",
    "firebase-admin>=7.1.0",
    "dishka>=1.7.2",
    "httpx>=0.28.0",
    "litestar[opentelemetry]>=2.21.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "psycopg[binary]>=3.3.2",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "structlog>=25.5.0",
    "uuid-utils>=0.14.1",
    "greenlet>=3.3.1",
    "aioboto3>=13.0.0",
    "faker>=40.8.0",
]

[dependency-groups]
backend = [
    "litestar>=2.20.0",
    "uvicorn[standard]>=0.41.0",
]
linters = [
    "mypy>=1.19.1",
    "ruff>=0.14.14",
]
tests = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-deadfixtures>=3.1.0",
]
dev = [
    { include-group = "linters" },
    { include-group = "backend" },
    { include-group = "tests" },
]

[project.scripts]
api = "app.presentation.api.bootstrap.main:sync_entrypoint"
import-ml-users = "app.infra.scripts.import_ml_users:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
strict_bytes = true
ignore_missing_imports = true
local_partial_types = true
warn_unreachable = true
files = ["src/app"]
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
    "deprecated",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
omit = ["tests/*", "**/__main__.py", "**/.venv/*", "**/site-packages/*", "*dishka_factory*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# fail_under = 100

[tool.pytest.ini_options]
addopts = "--strict-markers --showlocals --verbosity 2"
asyncio_mode = "auto"
log_level = "DEBUG"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "ERA",    # flake8-eradicate
    "EXE",    # flake8-executable
    "F",      # pyflakes
    "FA",     # flake8-future-annotations
    "FBT",    # flake8-boolean-trap
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PD",     # pandas-vet
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TCH",    # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
ignore = [
    "COM812",   # trailing comma conflicts with ruff format
    "ISC001",   # implicit string concat conflicts with ruff format

    "D100",     # missing docstring in public module
    "D101",     # missing docstring in public class
    "D102",     # missing docstring in public method
    "D103",     # missing docstring in public function
    "D104",     # missing docstring in public package
    "D105",     # missing docstring in magic method
    "D106",     # missing docstring in public nested class
    "D107",     # missing docstring in __init__
    "D203",     # blank line before class docstring
    "D213",     # multi-line docstring summary on second line

    "A005",     # shadowing builtin module names
    "ERA",      # commented-out code
    "ISC003",   # explicit string concat
    "PLR09",    # complexity rules
    "PLR2004",  # magic value comparisons
    "PLR6301",  # method could be static
    "RUF001",   # ambiguous unicode characters
    "RUF002",   # ambiguous unicode in docstring
    "RUF003",   # ambiguous unicode in comment
    "S106",     # hardcoded password
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
